# Screen-ISS Configuration
# Evaluate a predefined set of entrainers for ISS performance
# (No molecule generation, only screening)

mode: "screen"

# Binary mixture: Methyl acetate (A) / Methanol (B)
mixture:
  component_a:        # Isopropanol (C3H8O)
    groups: {CH3: 2, CH: 1, OH: 1}

  component_b:        # Water (H2O)
    groups: {H2O: 1} 

# Override with experimental data so we DON'T rely on UNIFAC here
pure_properties:
  component_a:   
    tc: 509.2    
    pc: 49.0  
    tb: 355.5  

# Predefined entrainers to evaluate
screen:
  entrainers:
    - name: "ethylene_glycol"
      groups: {DOH: 1}

    - name: "DMSO"
      groups: {DMSO: 1}

    - name: "propylene_glycol"
      groups: {CH3: 1, CH: 1, CH2: 1, OH: 2}




# Property screening
screening:
  pure:
    #tb: [36.0, 500.0]  # K
    #tm: [0.0, 298.0]    # K
    #hv: [-9999.0, 67.0] # kJ/mol

  mixture:
    no_azeotrope_AE: true
    no_azeotrope_BE: true
    miscibility: true
    selectivity_min: 0.5

# ISS settings
iss:
  x_iso: 0.6
  x_min: 0.2

# Output
output:
  dir: "results/IECR/screen_thf_water"
  formats: ["csv", "json"]
  verbose: true
