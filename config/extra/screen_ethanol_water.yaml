# Screen-ISS Configuration
# Evaluate a predefined set of entrainers for ISS performance
# (No molecule generation, only screening)

mode: "screen"

# Binary mixture: Ethanol/Water separation
mixture:
  component_a:
    groups: {CH3: 1, CH2: 1, OH: 1}  # Ethanol
  component_b:
    groups: {H2O: 1}  # Water

# override with experimental data
pure_properties:
  component_a:   
    tc: 514.7    
    pc: 63.0 
    tb: 351.5  


# Predefined entrainers to evaluate
screen:
  entrainers:
    - name: "ethylene_glycol"
      groups: {DOH: 1}

    - name: "Glycerol"
      groups: {CH2: 2, CH: 1, OH: 3}

    - name: "propylene_glycol"
      groups: {CH3: 1, CH: 1, CH2: 1, OH: 2}

    - name: "tetraethylene-glycol"
      groups: {CH2: 5, CH2O: 3, OH: 2}




# Property screening
screening:
  pure:
    #tb: [36.0, 500.0]  # K
    #tm: [0.0, 298.0]    # K
    #hv: [-9999.0, 67.0] # kJ/mol

  mixture:
    no_azeotrope_AE: true
    no_azeotrope_BE: true
    miscibility: true
    selectivity_min: 0.5

# ISS settings
iss:
  x_iso: 0.6
  x_min: 0.2

# Output
output:
  dir: "results/extra/screen_ethanol_water"
  formats: ["csv", "json"]
  verbose: true
