mode: "design"

# Binary mixture: Ethyl acetate (A) / Ethanol (B)
mixture:
  component_a:        # Ethyl acetate (CH3–COO–CH2–CH3)
    groups: {CH3: 1, CH2: 1, CH3COO: 1}

  component_b:        # Ethanol (CH3–CH2–OH)
    groups: {CH3: 1, CH2: 1, OH: 1} 

# Override with experimental data so we DON'T rely on UNIFAC here
pure_properties:
  #component_a:   
  #  tc: 530.0    
  #  pc: 38.83     
  #  tb: 350.0   
  component_b:   
    tc: 514.0    
    pc: 63.0     
    tb: 351.5

# Solvent design settings
design:
  groups: ["CH3", "CH2", "CH", "C", "OH", "CHO", "HCO", "CH3COO", "CH2COO",
           "HCOO", "CH3CO", "CH2O", "COOH", "COO", "H2O","DMSO", "DOH"]

  constraints:
    min_groups: 3
    max_groups: 6
    min_func_groups: 1
    max_func_groups: 2
    molecular_type: 1  # acyclic

  max_candidates: 10000

screening:
  pure:
    tb: [368.0, 650.0]
    tm: [0.0, 298.0]
    hv: [-9999.0, 1500.0]

  mixture:
    no_azeotrope_AE: true
    no_azeotrope_BE: true
    miscibility: true
    selectivity_min: 3.0

iss:
  x_iso: 0.85
  x_min: 0.40

output:
  dir: "results/paper2/design_ethylacetate_ethanol"
  formats: ["csv", "json"]
  verbose: true
